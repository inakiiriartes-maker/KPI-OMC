<html lang="es">
<head>

<title>Dashboard KPIs por salón · 2025 vs 2026 (sin IVA)</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --border: #e1e0d9;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --green: #008300;
    --red: #d03b3b;
    --accent: #2a78d6;
    --accent2: #a15c2a;
    --row-alt: #fafaf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    padding: 2rem 1rem;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 1.25rem; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 4px 0 0; }

  .month-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1rem;
  }
  .month-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .month-btn:hover { border-color: var(--text-muted); }
  .month-btn.active {
    background: var(--text-primary);
    color: #fff;
    border-color: var(--text-primary);
  }
  .month-btn-total {
    margin-left: 6px;
    padding-left: 14px;
    border-left: 1px solid var(--border);
    font-weight: 600;
  }
  .month-btn-total.active {
    background: var(--accent);
    border-color: var(--accent);
  }

  .download-bar {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 1rem;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .download-btn:hover { border-color: var(--text-muted); color: var(--text-primary); }

  .group-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .group-btn {
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .group-btn.active[data-group="propios"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .group-btn.active[data-group="franquicia"] {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.25rem;
    border-bottom: 0.5px solid var(--border);
    padding-bottom: 12px;
  }
  .tab-btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 0.5px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .tab-btn:hover { border-color: var(--text-muted); }
  .tab-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .tab-btn.active.franquicia { background: var(--accent2); border-color: var(--accent2); }

  .panel { display: none; }
  .panel.active { display: block; }
  .summary-row { display: flex; gap: 24px; margin-bottom: 1rem; flex-wrap: wrap; }
  .summary-tile { background: var(--card); border: 0.5px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; min-width: 140px; }
  .summary-label { font-size: 12px; color: var(--text-secondary); margin: 0 0 2px; }
  .summary-value { font-size: 18px; font-weight: 500; margin: 0; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 0.5px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 13px; }
  thead th { text-align: left; padding: 10px 12px; font-weight: 500; color: var(--text-secondary); border-bottom: 0.5px solid var(--border); background: var(--row-alt); }
  thead th.num { text-align: right; }
  tbody td { padding: 8px 12px; border-bottom: 0.5px solid var(--border); }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child td { border-bottom: none; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .na { color: var(--text-muted); }
  footer { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 2rem; }
</style>
</head>

function computeAccumulatedGroup(group) {
  const result = {};
  KPI_ORDER.forEach(kpi => {
    const isAsp = kpi === 'ASP Woman' || kpi === 'ASP Men';
    const visitsKpi = kpi === 'ASP Woman' ? 'Visits Woman' : (kpi === 'ASP Men' ? 'Visits Men' : null);
    const salonMap = new Map();
    let kind = null, label = null;

    MONTHS.forEach(month => {
      const monthGroupData = DATA_BY_MONTH_GROUP[month] && DATA_BY_MONTH_GROUP[month][group];
      if (!monthGroupData) return;
      const info = monthGroupData[kpi];
      if (!info) return;
      kind = info.kind;
      label = info.label;

      if (isAsp) {
        const visitsInfo = monthGroupData[visitsKpi];
        const visitsById = {};
        if (visitsInfo) visitsInfo.rows.forEach(r => { visitsById[r.id] = r; });
        info.rows.forEach(r => {
          if (!salonMap.has(r.id)) salonMap.set(r.id, { salon: r.salon, rev25: 0, vis25: 0, rev26: 0, vis26: 0 });
          const acc = salonMap.get(r.id);
          const vr = visitsById[r.id];
          if (r.v25 !== null && vr && vr.v25 !== null) { acc.rev25 += r.v25 * vr.v25; acc.vis25 += vr.v25; }
          if (r.v26 !== null && vr && vr.v26 !== null) { acc.rev26 += r.v26 * vr.v26; acc.vis26 += vr.v26; }
        });
      } else {
        info.rows.forEach(r => {
          if (!salonMap.has(r.id)) salonMap.set(r.id, { salon: r.salon, v25: null, v26: null });
          const acc = salonMap.get(r.id);
          if (r.v25 !== null) acc.v25 = (acc.v25 ?? 0) + r.v25;
          if (r.v26 !== null) acc.v26 = (acc.v26 ?? 0) + r.v26;
        });
      }
    });

    const rows = Array.from(salonMap.entries()).map(([id, acc]) => {
      if (isAsp) {
        const v25 = acc.vis25 ? acc.rev25 / acc.vis25 : null;
        const v26 = acc.vis26 ? acc.rev26 / acc.vis26 : null;
        return { id, salon: acc.salon, v25, v26 };
      }
      return { id, salon: acc.salon, v25: acc.v25, v26: acc.v26 };
    });

    result[kpi] = { kind, label, rows };
  });
  return result;
}

function fmtEur(v) {
  if (v === null || v === undefined) return '<span class="na">—</span>';
  return v.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function fmtCount(v) {
  if (v === null || v === undefined) return '<span class="na">—</span>';
  return v.toLocaleString('es-ES');
}
function fmtVal(v, kind) { return kind === 'eur' ? fmtEur(v) : fmtCount(v); }
function delta(v25, v26) {
  if (v25 === null || v26 === null || v25 === undefined || v26 === undefined || v25 === 0) {
    return '<span class="na">—</span>';
  }
  const pct = ((v26 - v25) / v25) * 100;
  const cls = pct >= 0 ? 'up' : 'down';
  const sign = pct >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${pct.toFixed(1)}%</span>`;
}
function deltaPlain(pct) {
  if (pct === null) return '<span class="na">—</span>';
  const cls = pct >= 0 ? 'up' : 'down';
  const sign = pct >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function aggregate(DATA, kpi) {
  const info = DATA[kpi];
  const rows = info.rows;
  const kind = info.kind;
  const isAsp = kpi === 'ASP Woman' || kpi === 'ASP Men';
  const visitsKpi = kpi === 'ASP Woman' ? 'Visits Woman' : (kpi === 'ASP Men' ? 'Visits Men' : null);

  if (isAsp) {
    const visitsRows = DATA[visitsKpi].rows;
    const visitsById = {};
    visitsRows.forEach(r => { visitsById[r.id] = r; });

    let rev25 = 0, vis25 = 0, rev26 = 0, vis26 = 0;
    rows.forEach(r => {
      const vr = visitsById[r.id];
      if (r.v25 !== null && vr && vr.v25 !== null) { rev25 += r.v25 * vr.v25; vis25 += vr.v25; }
      if (r.v26 !== null && vr && vr.v26 !== null) { rev26 += r.v26 * vr.v26; vis26 += vr.v26; }
    });
    const val25 = vis25 ? rev25 / vis25 : null;
    const val26 = vis26 ? rev26 / vis26 : null;
    const pct = (val25 !== null && val26 !== null && val25 !== 0) ? ((val26 - val25) / val25 * 100) : null;
    return { label: info.label, kind, val25, val26, pct, isAvg: true };
  }

  const v25list = rows.filter(r => r.v25 !== null).map(r => r.v25);
  const v26list = rows.filter(r => r.v26 !== null).map(r => r.v26);
  const val25 = v25list.length ? v25list.reduce((a,b) => a+b, 0) : null;
  const val26 = v26list.length ? v26list.reduce((a,b) => a+b, 0) : null;
  const pct = (val25 !== null && val26 !== null && val25 !== 0) ? ((val26 - val25) / val25 * 100) : null;
  return { label: info.label, kind, val25, val26, pct, isAvg: false };
}

function buildResumenHtml(DATA) {
  const cards = KPI_ORDER.map(kpi => {
    const a = aggregate(DATA, kpi);
    const v25 = Math.round((a.val25 ?? 0) * 100) / 100;
    const v26 = Math.round((a.val26 ?? 0) * 100) / 100;
    const tag = a.isAvg ? 'ticket medio ponderado' : 'total salones';
    return `
      <div class="summary-tile" style="min-width: 200px;">
        <p class="summary-label">${a.label} <span style="color: var(--text-muted);">(${tag})</span></p>
        <p class="summary-value">${fmtVal(v26, a.kind)}</p>
        <p style="font-size:12px; color: var(--text-secondary); margin: 2px 0 0;">2025: ${fmtVal(v25, a.kind)} &nbsp;·&nbsp; ${deltaPlain(a.pct)}</p>
      </div>
    `;
  }).join('');

  return `
    <div class="panel active" id="panel0">
      <div class="summary-row" style="flex-wrap: wrap;">
        ${cards}
      </div>
    </div>
  `;
}

function buildKpiPanelHtml(DATA, kpi, idx) {
  const info = DATA[kpi];
  const rows = info.rows.slice().sort((a, b) => a.salon.localeCompare(b.salon, 'es'));
  const kind = info.kind;
  const isAsp = kpi === 'ASP Woman' || kpi === 'ASP Men';

  let total25, total26, n25 = 0, n26 = 0, labelTag;

  if (isAsp) {
    const a = aggregate(DATA, kpi);
    total25 = a.val25;
    total26 = a.val26;
    rows.forEach(r => { if (r.v25 !== null) n25++; if (r.v26 !== null) n26++; });
    labelTag = 'Ticket medio ponderado';
  } else {
    total25 = 0; total26 = 0;
    rows.forEach(r => {
      if (r.v25 !== null) { total25 += r.v25; n25++; }
      if (r.v26 !== null) { total26 += r.v26; n26++; }
    });
    labelTag = 'Total';
  }
  const totalDeltaPct = (total25 !== null && total26 !== null && total25 !== 0) ? ((total26 - total25) / total25 * 100) : null;

  const summaryHtml = `
    <div class="summary-row">
      <div class="summary-tile">
        <p class="summary-label">${labelTag} 2025 (${n25} salones)</p>
        <p class="summary-value">${fmtVal(total25 !== null ? Math.round(total25 * 100) / 100 : null, kind)}</p>
      </div>
      <div class="summary-tile">
        <p class="summary-label">${labelTag} 2026 (${n26} salones)</p>
        <p class="summary-value">${fmtVal(total26 !== null ? Math.round(total26 * 100) / 100 : null, kind)}</p>
      </div>
      <div class="summary-tile">
        <p class="summary-label">Variación total</p>
        <p class="summary-value">${totalDeltaPct !== null ? (totalDeltaPct >= 0 ? '+' : '') + totalDeltaPct.toFixed(1) + '%' : '—'}</p>
      </div>
    </div>
  `;

  const rowsHtml = rows.map(r => `
    <tr>
      <td>${r.salon}</td>
      <td class="num">${fmtVal(r.v25, kind)}</td>
      <td class="num">${fmtVal(r.v26, kind)}</td>
      <td class="num">${delta(r.v25, r.v26)}</td>
    </tr>
  `).join('');

  return `
    <div class="panel" id="panel${idx}">
      ${summaryHtml}
      <table>
        <thead>
          <tr>
            <th>Salón</th>
            <th class="num">2025</th>
            <th class="num">2026</th>
            <th class="num">Var.</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml}
        </tbody>
      </table>
    </div>
  `;
}

function round2(v) { return (v === null || v === undefined) ? null : Math.round(v * 100) / 100; }
function round1(v) { return (v === null || v === undefined) ? null : Math.round(v * 10) / 10; }
function numCsv(v) { return (v === null || v === undefined) ? '' : String(v).replace('.', ','); }
function csvEscape(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv(rows) {
  return rows.map(r => r.map(csvEscape).join(';')).join('\r\n');
}
function downloadCsv(filename, rows) {
  const csv = '﻿' + buildCsv(rows);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function safeFileToken(s) {
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

    kpiRows.forEach(r => {
      const pct = (r.v25 !== null && r.v26 !== null && r.v25 !== 0) ? ((r.v26 - r.v25) / r.v25 * 100) : null;
      rows.push([r.salon, numCsv(round2(r.v25)), numCsv(round2(r.v26)), pct !== null ? numCsv(round1(pct)) : '']);
    });
  }

  const filename = `KPIs_${safeFileToken(currentMonth)}_${safeFileToken(currentGroup)}_${safeFileToken(kpiLabelForName)}.csv`;
  downloadCsv(filename, rows);
}

function exportAllData() {
  const rows = [['Periodo', 'Grupo', 'KPI', 'Salón', '2025', '2026', 'Variación %']];
  Object.keys(DATA_BY_MONTH_GROUP).forEach(month => {
    const periodoLabel = month === 'Acumulado' ? `Acumulado (${MONTHS.join(', ')})` : month;
    const groups = DATA_BY_MONTH_GROUP[month];
    Object.keys(groups).forEach(group => {
      const groupLabel = group === 'propios' ? 'Salones propios' : 'Salones franquiciados';
      const DATA = groups[group];
      KPI_ORDER.forEach(kpi => {
        const info = DATA[kpi];
        if (!info) return;
        info.rows.forEach(r => {
          const pct = (r.v25 !== null && r.v26 !== null && r.v25 !== 0) ? ((r.v26 - r.v25) / r.v25 * 100) : null;
          rows.push([periodoLabel, groupLabel, KPI_TAB_LABELS[kpi], r.salon, numCsv(round2(r.v25)), numCsv(round2(r.v26)), pct !== null ? numCsv(round1(pct)) : '']);
        });
      });
    });
  });
  downloadCsv('KPIs_todos_los_datos.csv', rows);
}

document.getElementById('downloadViewBtn').addEventListener('click', exportCurrentView);
document.getElementById('downloadAllBtn').addEventListener('click', exportAllData);

renderAll();
</script>
</body>
</html>
